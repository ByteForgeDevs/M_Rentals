services:
  - type: web
    name: mrentals
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /
    disk:
      # Listing photos and ID verification documents are uploaded by users, and
      # Render wipes the container filesystem on every deploy. Without a disk
      # every image would disappear the moment the service restarts.
      name: mrentals-media
      mountPath: /var/data/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
