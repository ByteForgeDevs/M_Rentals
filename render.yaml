services:
  - type: web
    name: mrentals
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # The Postgres instance is shared with another Django project, so Mrentals
      # is confined to its own schema to keep the two sets of tables apart.
      - key: DJANGO_DB_SCHEMA
        value: mrentals
      # Free instances have no persistent disk, so uploads do not survive a
      # deploy. Reseeding keeps the demo listings usable. Attach a disk, set
      # DJANGO_MEDIA_ROOT to its mount path, and turn this off to keep real
      # uploads.
      - key: SEED_DEMO_ON_DEPLOY
        value: "true"
