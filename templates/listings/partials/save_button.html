<form hx-post="{% url 'listings:toggle_save' listing.slug %}"
      hx-target="#save-button" hx-swap="innerHTML"
      method="post" action="{% url 'listings:toggle_save' listing.slug %}">
  {% csrf_token %}
  <button type="submit" class="{% if is_saved %}btn-dark{% else %}btn-outline{% endif %} w-full">
    {% if is_saved %}Remove from saved{% else %}Save this house{% endif %}
  </button>
</form>
