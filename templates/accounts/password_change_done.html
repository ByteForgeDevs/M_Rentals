{% extends "base.html" %}
{% load ui %}

{% block title %}Password changed | {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-md px-4 py-16 text-center">
  <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-50 text-brand-700">{% icon "check" "h-7 w-7" "2" %}</span>
  <h1 class="mt-5 text-display-sm">Password changed</h1>
  <p class="mt-2 text-slate-600">Your new password is active on this account.</p>
  <a href="{% url 'pages:dashboard' %}" class="btn-primary btn-lg btn-touch mt-6">Back to dashboard</a>
</div>
{% endblock %}
